<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verd - Gana Viendo Anuncios</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">

    <!-- Auth Screens -->
    <div id="auth-screen" style="display: none;">
        <div id="login-form" class="auth-container">
            <div class="logo" style="margin-bottom: 20px; font-size: 40px; text-align: center;">Verd</div>
            <h2>Bienvenido</h2>
            <p>Inicia sesión para empezar a ganar.</p>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">INGRESAR</button>
            <button class="btn btn-link" onclick="toggleAuth('register')">¿No tienes cuenta? Regístrate</button>
        </div>

        <div id="register-form" class="auth-container" style="display: none;">
            <div class="logo" style="margin-bottom: 20px; font-size: 40px; text-align: center;">Verd</div>
            <h2>Crear Cuenta</h2>
            <p>Únete a la comunidad Verd.</p>
            <div class="form-group">
                <label>Nombre de Usuario</label>
                <input type="text" id="reg-username" placeholder="ej. juanito123">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="tel" id="reg-phone" placeholder="+57 300...">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="reg-password" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Código de Referido (Opcional)</label>
                <input type="text" id="reg-referral" placeholder="Código">
            </div>
            <button class="btn btn-primary" onclick="handleRegister()">REGISTRARSE</button>
            <button class="btn btn-link" onclick="toggleAuth('login')">¿Ya tienes cuenta? Ingresa</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="main-app" style="display: none;">
        <header>
            <div class="logo">Verd</div>
            <div class="points-display"><span id="user-points">0</span> <i class="fas fa-coins"></i></div>
        </header>

        <main id="main-content"></main>

        <nav class="bottom-nav">
            <button onclick="showWindow('free')" id="nav-free" class="active">
                <i class="fas fa-th-large"></i>
                <span>Libres</span>
            </button>
            <button onclick="showWindow('random')" id="nav-random">
                <i class="fas fa-play-circle"></i>
                <span>Random</span>
            </button>
            <button onclick="showWindow('config')" id="nav-config">
                <i class="fas fa-user-circle"></i>
                <span>Perfil</span>
            </button>
        </nav>
    </div>

    <!-- Notifications -->
    <div id="notification-toast"></div>

    <!-- Video Modal -->
    <div id="video-modal" class="modal">
        <div class="modal-content">
            <video id="ad-video" playsinline></video>
            <div id="video-timer">15s</div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
