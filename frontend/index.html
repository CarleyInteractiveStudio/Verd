<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verd - Gana Viendo Anuncios</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">
    <div id="app">
        <header>
            <div class="logo">Verd</div>
            <div class="points-display"><span id="user-points">0</span> <i class="fas fa-coins"></i></div>
        </header>
        <main id="main-content"></main>
        <nav class="bottom-nav">
            <button onclick="showWindow('free')" id="nav-free" class="active"><i class="fas fa-list"></i><span>Libres</span></button>
            <button onclick="showWindow('random')" id="nav-random"><i class="fas fa-play-circle"></i><span>Random</span></button>
            <button onclick="showWindow('config')" id="nav-config"><i class="fas fa-cog"></i><span>Config</span></button>
        </nav>
    </div>
    <div id="video-modal" class="modal">
        <div class="modal-content">
            <video id="ad-video" controls autoplay></video>
            <div id="video-timer">15s</div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
